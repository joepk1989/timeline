<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tijdlijn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0EB; --surface:#FFFFFF; --ink:#1D2733; --muted:#5E6A76; --line:#D4D9D2; --faint:#E3E6E0;
  --accent:#2B4A7E; --accent-ink:#FFFFFF; --weekend:#F4F5F1; --danger:#B3261E;
  --winter:#6E9CC4; --lente:#7DB35A; --zomer:#EDB032; --herfst:#9C5B2E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141920; --surface:#1D242D; --ink:#E7EBEE; --muted:#98A3AF; --line:#2E3843; --faint:#232B35;
    --accent:#9BBBF2; --accent-ink:#111822; --weekend:#181E26; --danger:#F2867E;
    --winter:#7FAAD0; --lente:#8CC468; --zomer:#F0B942; --herfst:#C27A45;
  }
}
:root[data-theme="dark"]{
  --bg:#141920; --surface:#1D242D; --ink:#E7EBEE; --muted:#98A3AF; --line:#2E3843; --faint:#232B35;
  --accent:#9BBBF2; --accent-ink:#111822; --weekend:#181E26; --danger:#F2867E;
  --winter:#7FAAD0; --lente:#8CC468; --zomer:#F0B942; --herfst:#C27A45;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);height:100%;display:flex;flex-direction:column;overflow:hidden;
  font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- Top bar ---------- */
.bar{flex:0 0 auto;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:1000px;margin:0 auto;padding:12px 20px 8px;display:flex;align-items:center;gap:10px}
.scope-title{font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.1;flex:1;min-width:0}
.scope-title::first-letter{text-transform:uppercase}
.scope-title small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:600;color:var(--muted);margin-top:2px}
.iconbtn{height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:15px;flex:0 0 auto}
.iconbtn svg{width:18px;height:18px}
.iconbtn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.filters{max-width:1000px;margin:0 auto;padding:0 20px 6px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.fchip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--ink))}
.fchip.all::before{display:none}
.fchip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.minimap{max-width:1000px;margin:0 auto;padding:4px 20px 0;display:flex;gap:2px;align-items:flex-end;height:36px;width:100%}
.tick{--s:var(--muted);flex:1 1 0;min-width:2px;height:8px;border-radius:2px;background:var(--line);border:none;padding:0}
.tick.has{height:18px;background:var(--muted)}
.tick.m{background:color-mix(in srgb,var(--s) 35%,transparent)}
.tick.m.has{background:var(--s)}
.tick.cur{height:28px;background:var(--accent)}
.tick.m.cur{background:var(--s);outline:2px solid var(--ink);outline-offset:1px}
.minimap-labels{max-width:1000px;width:100%;margin:0 auto;padding:4px 20px 8px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

/* ---------- Pager ---------- */
.pager{flex:1 1 auto;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
  overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;width:100%;height:100%;overflow-y:auto;scroll-snap-align:start;scroll-snap-stop:always}
.page-in{max-width:860px;margin:0 auto;padding:18px 24px 120px}
.big{margin:0;font-size:clamp(84px,20vw,168px);font-weight:800;letter-spacing:-.055em;line-height:.85}
.big.now{color:var(--accent)}
.big.mname{font-size:clamp(52px,13vw,112px);letter-spacing:-.045em;text-transform:capitalize}
.count{color:var(--muted);font-size:15px;margin:10px 0 18px}

.seasons{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-bottom:6px}
.seasons button{--s:var(--winter);height:44px;border:none;border-radius:6px;padding:4px 0 0;background:color-mix(in srgb,var(--s) 30%,transparent);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-size:11px;color:var(--ink);overflow:hidden}
.seasons button::after{content:"";align-self:stretch;height:4px;background:var(--s)}
.seasons button .c{font-size:11px;font-weight:800;line-height:1;min-height:11px}
.seasons button.has{background:var(--s);color:#fff}
.seasons button.cur{outline:2px solid var(--ink);outline-offset:1px}
.tip{font-size:12px;color:var(--muted);margin:0 0 20px}

.items{display:flex;flex-direction:column;gap:2px}
.item{--s:var(--accent);display:grid;grid-template-columns:104px 28px 1fr auto;gap:12px;align-items:start;text-align:left;
  background:transparent;border:none;border-radius:10px;padding:10px 10px 10px 0;width:100%}
.item:hover{background:var(--surface)}
.item .when{font-size:14px;color:var(--muted);padding-top:3px;padding-left:12px;border-left:4px solid var(--s);line-height:1.3}
.item .em{font-size:22px;line-height:1.1;text-align:center}
.item .ttl{font-size:18px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.item .note{font-size:14px;color:var(--muted);margin-top:3px;white-space:pre-wrap;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.item .thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;background:var(--faint)}
.item.year-level{background:var(--surface);border:1px solid var(--line);padding:14px 12px 14px 0;margin-bottom:10px}
.item.year-level .ttl{font-size:22px;font-weight:800;letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;gap:3px 10px;align-items:center;margin-top:3px;font-size:13px;color:var(--muted)}
.cat{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--ink)}
.cat::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.rel.soon{color:var(--accent);font-weight:600}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:4px 0 24px}
.cal .wh{font-size:12px;color:var(--muted);text-align:center}
.cell{--s:var(--winter);min-height:58px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:5px 5px 4px;
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;overflow:hidden}
.cell .n{font-size:15px;font-weight:800;line-height:1}
.cell .es{font-size:14px;line-height:1.1;white-space:nowrap;overflow:hidden;max-width:100%}
.cell .bars{margin-top:auto;align-self:stretch;display:flex;flex-direction:column;gap:2px;margin-left:-6px;margin-right:-6px}
.pb{height:5px;background:var(--c)}
.pb.s{margin-left:6px;border-radius:3px 0 0 3px}
.pb.e{margin-right:6px;border-radius:0 3px 3px 0}
.cell.we{background:var(--weekend)}
.cell.has{border-color:var(--s)}
.cell.today{outline:2px solid var(--accent);outline-offset:-2px}

.empty-s{color:var(--muted);padding:6px 0}
.empty{padding:5vh 0;color:var(--muted)}
.empty p{font-size:20px;color:var(--ink);margin:0 0 4px;font-weight:600}
.empty .iconbtn{margin-top:16px}

.nav{position:fixed;top:55%;transform:translateY(-50%);z-index:4;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(10,20,30,.12)}
.nav svg{width:22px;height:22px}
.nav.prev{left:max(14px,env(safe-area-inset-left,0px))}
.nav.next{right:max(14px,env(safe-area-inset-right,0px))}
.nav:disabled{opacity:0;pointer-events:none}
@media (hover:none),(max-width:640px){.nav{display:none}}
.fab{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:6;
  height:56px;padding:0 22px;border-radius:999px;border:none;background:var(--ink);color:var(--surface);font-weight:600;font-size:16px;
  display:inline-flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(10,20,30,.25)}
.fab svg{width:20px;height:20px}

/* ---------- Dialogs ---------- */
dialog{color:var(--ink)}
dialog::backdrop{background:rgba(15,22,30,.45)}
dialog#menu{margin:0 0 0 auto;height:100%;max-height:100%;width:min(560px,100vw);max-width:100vw;border:none;padding:0;background:var(--bg);box-shadow:-10px 0 40px rgba(10,20,30,.25)}
dialog#menu[open]{animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.menu-in{height:100%;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 0 calc(env(safe-area-inset-bottom,0px) + 24px)}
.menu-head{display:flex;align-items:center;justify-content:space-between;padding:0 18px 12px}
.menu-head h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
section.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:0 12px 12px;overflow:hidden}
.sh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:14px 16px 8px}
.sh h3{margin:0;font-size:18px;font-weight:800;display:flex;align-items:baseline;gap:8px}
.sh h3 span{font-size:13px;font-weight:600;color:var(--muted)}
.sh .hint{color:var(--muted);font-size:13px;margin-left:auto}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-left:auto}
.legend b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
.strip{position:relative;display:flex;gap:8px;overflow-x:auto;padding:4px 16px 14px;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.strip > *{scroll-snap-align:center;flex:0 0 auto}
.scope{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:4px 16px 16px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px;color:var(--ink)}
.scope .field input{width:100px;font-size:17px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:13px}
.btn{padding:10px 16px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--surface);font-weight:600;font-size:15px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--danger);border-color:transparent;margin-right:auto;padding-left:4px}
.btn:disabled{opacity:.5;cursor:default}

.year{width:92px;height:84px;border:1px solid var(--line);border-radius:10px;background:transparent;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:8px 10px;text-align:left}
.year .num{font-size:28px;font-weight:800;letter-spacing:-.04em;line-height:1}
.year .em{font-size:16px;height:20px}
.year.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.month{--s:var(--winter);width:96px;height:84px;border-radius:10px;border:2px solid transparent;background:color-mix(in srgb,var(--s) 24%,var(--surface));
  display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:9px 10px 8px;text-align:left;position:relative;overflow:hidden}
.month::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--s)}
.month .name{font-size:16px;font-weight:800;text-transform:capitalize}
.month .ssn{font-size:11px;color:var(--muted)}
.month .em{font-size:16px;height:20px}
.month.sel{border-color:var(--ink)}
.day{--s:var(--winter);width:52px;height:80px;border-radius:9px;border:1px solid var(--line);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:7px 3px 0;overflow:hidden}
.day .wd{font-size:11px;color:var(--muted)}
.day .d{font-size:20px;font-weight:800;line-height:1}
.day .em{font-size:14px;height:18px}
.day::after{content:"";align-self:stretch;height:4px;background:var(--s);opacity:.35;margin:0 -3px}
.day.has::after{opacity:1}
.day.we{background:var(--weekend)}
.day.today{border:2px dashed var(--ink)}
.day.sel{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.day.sel .wd{color:inherit;opacity:.75}
.grp{padding:2px 16px 12px}
.grp h4{margin:6px 0 8px;font-size:13px;color:var(--muted);font-weight:600}
.grp h4::first-letter{text-transform:uppercase}
.mini{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);margin-bottom:6px}
.mini .em{font-size:18px;width:24px;text-align:center}
.mini .t{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .k{font-size:12px;color:var(--muted)}
.addbtn{width:100%;padding:10px 12px;border-radius:9px;border:1px dashed var(--muted);background:transparent;text-align:left;font-weight:600;color:var(--accent)}
.addbtn:disabled{color:var(--muted);border-color:var(--line);cursor:default;font-weight:400}
.bk{display:flex;flex-wrap:wrap;gap:8px;padding:4px 16px 8px}
.bk-note{font-size:13px;color:var(--muted);padding:0 16px 16px;margin:0}

dialog.card{border:none;border-radius:16px;padding:0;width:min(480px,calc(100vw - 24px));max-height:calc(100% - 24px);background:var(--surface);box-shadow:0 20px 60px rgba(10,20,30,.3)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:14px}
.dlg h3{margin:0;font-size:22px;font-weight:800;line-height:1.2}
.dlg h3::first-letter{text-transform:uppercase}
.dlg > label,.lab{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.dlg input[type=text],.dlg textarea,.dlg input[type=number],.dlg select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px;color:var(--ink)}
.dlg textarea{min-height:80px;resize:vertical}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:19px}
.emojis button.on{border:2px solid var(--ink);background:var(--bg)}
.catpick{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;align-self:flex-start}
.seg button{padding:8px 16px;border:none;background:transparent;font-weight:600;font-size:14px}
.seg button.on{background:var(--ink);color:var(--surface)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.w-day{width:72px}.w-year{width:96px}
.check,.dlg > label.check{display:flex;flex-direction:row;align-items:center;gap:10px;font-size:15px;color:var(--ink)}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.photos{display:flex;flex-wrap:wrap;gap:10px}
.ph{position:relative;width:84px;height:84px}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:8px;cursor:zoom-in;display:block}
.ph .x{position:absolute;top:-7px;right:-7px;width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);background:var(--ink);color:var(--surface);font-size:13px;line-height:1;padding:0}
.addph{width:84px;height:84px;border:1px dashed var(--muted);border-radius:8px;background:transparent;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.addph b{font-size:22px;font-weight:400;line-height:1}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:-20px;background:var(--surface);padding:10px 0 4px;margin-bottom:-4px}
dialog#lightbox{border:none;padding:0;background:transparent;max-width:100vw;max-height:100%}
dialog#lightbox::backdrop{background:rgba(0,0,0,.88)}
#lightbox img{display:block;max-width:94vw;max-height:86vh;border-radius:8px}
#lightbox button{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px}

.toast{position:fixed;inset:auto;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);margin:0;border:none;
  background:var(--ink);color:var(--surface);padding:10px 12px 10px 16px;border-radius:10px;font-size:14px;max-width:92vw;z-index:10;
  display:none;align-items:center;gap:14px;box-shadow:0 8px 24px rgba(10,20,30,.25)}
.toast.show{display:flex}
.toast button{border:none;background:transparent;color:var(--surface);font-weight:800;text-decoration:underline;text-underline-offset:3px;padding:4px}

@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
@media (max-width:640px){
  .bar-in,.minimap,.minimap-labels,.filters{padding-left:14px;padding-right:14px}
  .page-in{padding:14px 14px 110px}
  .seasons button{font-size:9px}
  .item{grid-template-columns:74px 24px 1fr auto;gap:10px}
  .item .thumb{width:52px;height:52px}
  .iconbtn .lbl{display:none}
  #backBtn .lbl{display:inline}
  .iconbtn{padding:0 12px}
  .cal{gap:3px}
  .cell{min-height:52px;padding:4px 4px 3px}
  .cell .n{font-size:13px}
  .cell .es{font-size:12px}
}
/* ---------- v3: timelines, ages, photos ---------- */
.tl-btn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:none;background:transparent;text-align:left;padding:4px 6px 4px 0;border-radius:10px}
.tl-btn .tl-em{font-size:26px;line-height:1;flex:0 0 auto}
.tl-btn .tl-txt{min-width:0;display:flex;flex-direction:column}
.tl-btn b{font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-btn small{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-btn small::first-letter{text-transform:uppercase}
.tl-btn svg{width:16px;height:16px;flex:0 0 auto;color:var(--muted)}
.ageline{color:var(--accent);font-weight:600}
.rel.age{color:var(--ink);font-weight:600}
.item.virtual .ttl{font-weight:600}
.item.virtual{opacity:.92}
.viewseg{display:flex;margin:0 0 16px}
.viewseg .seg button{padding:7px 14px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:4px}
.ptile{position:relative;aspect-ratio:1;border:none;padding:0;border-radius:6px;overflow:hidden;background:var(--faint)}
.ptile img{width:100%;height:100%;object-fit:cover;display:block}
.ptile span{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 4px;font-size:11px;font-weight:600;color:#fff;text-align:left;
  background:linear-gradient(transparent,rgba(0,0,0,.6));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
dialog#gallery{border:none;padding:0;background:transparent;width:100vw;height:100%;max-width:100vw;max-height:100%;margin:0}
dialog#gallery::backdrop{background:rgba(0,0,0,.92)}
.gal{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 60px) 12px calc(env(safe-area-inset-bottom,0px) + 16px);color:#fff}
.gal img{max-width:100%;max-height:calc(100% - 110px);border-radius:8px;object-fit:contain;touch-action:pan-y;user-select:none}
.gcap{text-align:center;max-width:560px}
.gcap b{display:block;font-size:17px}
.gcap small{color:rgba(255,255,255,.72);font-size:13px}
.gtop{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.gtop .cnt{color:rgba(255,255,255,.72);font-size:14px}
.gnav{position:fixed;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:none;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center}
.gnav svg{width:22px;height:22px}
.gnav.p{left:12px}.gnav.n{right:12px}
.gnav:disabled{opacity:0;pointer-events:none}
@media (hover:none),(max-width:640px){.gnav{display:none}}
.tlrow{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.tlrow.on{border:2px solid var(--ink)}
.tlrow .pick{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:none;background:transparent;text-align:left;padding:0}
.tlrow .e{font-size:28px;line-height:1}
.tlrow b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlrow small{color:var(--muted);font-size:13px}
.tlrow .set{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:13px;font-weight:600}
.tllist{display:flex;flex-direction:column;gap:8px}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.type{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.type .e{font-size:28px;line-height:1}
.type b{font-size:15px}
.type small{font-size:12px;color:var(--muted);line-height:1.3}
.type:hover{border-color:var(--ink)}
.catrows{display:flex;flex-direction:column;gap:6px}
.catrow{display:flex;gap:8px;align-items:center}
.catrow .sw{width:36px;height:36px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);flex:0 0 auto;padding:0}
.catrow input{flex:1;min-width:0}
.catrow .x{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:transparent;flex:0 0 auto}
.linkbtn{border:none;background:transparent;color:var(--accent);font-weight:600;padding:0;align-self:flex-start;font-size:14px}
/* ---------- status ---------- */
.sst{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--c)}
.sst::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.rel.late{color:var(--danger);font-weight:700}
.stsum{display:flex;flex-wrap:wrap;gap:6px 14px;margin:-8px 0 18px;font-size:14px}
.fsep{flex:0 0 1px;background:var(--line);margin:4px 2px}
/* ---------- slideshow ---------- */
.deck{position:fixed;inset:0;z-index:40;background:#0E1217;color:#F2F4F6;overflow:hidden;
  --winter:#7FAAD0;--lente:#8CC468;--zomer:#F0B942;--herfst:#C27A45}
.deck.idle{cursor:none}
.stage{position:absolute;inset:0}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .8s ease}
.slide.in{opacity:1}
.slide .bg{position:absolute;inset:-6%;background-size:cover;background-position:center;filter:blur(40px) brightness(.32)}
.slide .photo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:5vh 5vw 34vh}
.slide .photo img{max-width:100%;max-height:100%;object-fit:contain;border-radius:1.2vh;box-shadow:0 3vh 8vh rgba(0,0,0,.55)}
.slide.in .photo img{animation:kb var(--dur,8s) linear forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.05)}}
.slide .edge{position:absolute;left:0;top:0;bottom:0;width:1.1vw;min-width:6px;background:var(--s)}
.slide .txt{position:absolute;left:7vw;right:7vw;bottom:13vh}
.slide.noph .txt{top:50%;bottom:auto;transform:translateY(-50%)}
.slide .em{font-size:clamp(56px,16vh,200px);line-height:1;margin-bottom:3vh}
.slide.hasph .em{display:none}
.slide .when{font-size:clamp(15px,2.6vh,34px);color:rgba(255,255,255,.78);display:flex;flex-wrap:wrap;gap:.4em 1.1em;align-items:center}
.slide .when .age{color:#fff;font-weight:700}
.slide .when .soon{color:#9BBBF2;font-weight:700}
.slide .when .late{color:#FF9C92;font-weight:700}
.slide .ttl{font-size:clamp(30px,7.5vh,110px);font-weight:800;letter-spacing:-.035em;line-height:1.02;margin:.18em 0 .2em;max-width:22ch}
.slide.hasph .ttl{font-size:clamp(26px,5.6vh,80px)}
.slide .note{font-size:clamp(15px,2.9vh,36px);color:rgba(255,255,255,.82);max-width:52ch;line-height:1.35;white-space:pre-wrap;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.slide.hasph .note{-webkit-line-clamp:2}
.slide .pill{display:inline-flex;align-items:center;padding:.2em .75em;border-radius:99px;background:var(--c);color:#fff;font-weight:700;font-size:.9em}
.slide .catp{display:inline-flex;align-items:center;gap:.4em}
.slide .catp::before{content:"";width:.6em;height:.6em;border-radius:50%;background:var(--c)}
.slide.year{display:flex;flex-direction:column;justify-content:center;padding:0 7vw}
.slide.year .yy{font-size:clamp(90px,34vh,420px);font-weight:800;letter-spacing:-.06em;line-height:.85}
.slide.year .yl{font-size:clamp(20px,4.5vh,60px);font-weight:600;color:#9BBBF2;margin-top:3vh}
.slide.year .yc{font-size:clamp(15px,2.8vh,34px);color:rgba(255,255,255,.7);margin-top:1vh}
.slide.year .seas{display:flex;gap:.6vw;margin-top:5vh;max-width:70vw}
.slide.year .seas i{flex:1;height:1.2vh;min-height:5px;border-radius:1vh;background:var(--s);opacity:.3}
.slide.year .seas i.on{opacity:1}
.slide.title{display:flex;flex-direction:column;justify-content:center;padding:0 7vw}
.slide.title .em{margin-bottom:2vh}
.slide.title .ttl{font-size:clamp(40px,11vh,150px)}
.prog{position:absolute;left:0;top:0;height:5px;width:0;background:rgba(255,255,255,.85);z-index:2}
.show-ui{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:18px max(24px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));
  background:linear-gradient(transparent,rgba(0,0,0,.7));transition:opacity .35s}
.deck.idle .show-ui{opacity:0;pointer-events:none}
.sbtn{height:48px;min-width:48px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;
  font-weight:600;font-size:15px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.sbtn svg{width:20px;height:20px}
.sbtn:hover{background:rgba(255,255,255,.2)}
.show-ui .cnt{color:rgba(255,255,255,.75);font-size:14px;margin-left:auto}
.show-ui .tl{color:#fff;font-weight:700;font-size:15px}
@media (prefers-reduced-motion:reduce){.slide{transition:none}.slide.in .photo img{animation:none}}

/* ---------- widescreen ---------- */
@media (min-width:1200px){
  .bar-in,.filters,.minimap,.minimap-labels{max-width:none;padding-left:3vw;padding-right:3vw}
  .page-in{max-width:none;padding:3vh 3vw 120px}
  .page-in.split{display:grid;grid-template-columns:minmax(360px,32%) minmax(0,1fr);gap:0 4vw;align-items:start}
  .page-in.split.mview{grid-template-columns:minmax(480px,46%) minmax(0,1fr)}
  .split .pl{position:sticky;top:0;padding-top:1vh}
  .split .pr{padding-top:2vh}
  .big{font-size:clamp(120px,10.5vw,280px)}
  .big.mname{font-size:clamp(72px,6vw,170px)}
  .item{grid-template-columns:140px 34px minmax(0,1fr) auto;padding:12px 14px 12px 0}
  .item .ttl{font-size:20px}
  .item .note{font-size:15px}
  .item .thumb{width:88px;height:88px}
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
  .cell{min-height:clamp(64px,7vh,110px)}
  .cell .n{font-size:17px}
  .cell .es{font-size:17px}
  .seasons button{height:clamp(52px,6vh,80px);font-size:13px}
  .split .pl .tip{margin-bottom:0}
  .nav.prev{left:1vw}.nav.next{right:1vw}
}
/* scale the interface up on large, high monitors so it stays readable from a distance */
@media (min-width:2300px) and (min-height:1250px){ .bar,.page-in,dialog.card,.menu-in,.fab,.nav{zoom:1.25} }
@media (min-width:3200px) and (min-height:1400px){ .bar,.page-in,dialog.card,.menu-in,.fab,.nav{zoom:1.5} }
@media (min-width:3600px) and (min-height:2000px){ .bar,.page-in,dialog.card,.menu-in,.fab,.nav{zoom:2} }
@media (min-width:1200px){
  .split .pl{container-type:inline-size}
  .split .big{font-size:min(40cqi,300px)}
  .split .big.mname{font-size:min(19cqi,180px)}
  .split .count{margin-top:16px}
}
}
/* slideshow on wide screens: photo right, story left */
@media (min-aspect-ratio:3/2){
  .slide.hasph .photo{left:auto;width:62vw;padding:5vh 3.5vw 5vh 0}
  .slide.hasph .photo img{max-height:90vh}
  .slide.hasph .txt{left:5vw;right:auto;width:30vw;top:50%;bottom:auto;transform:translateY(-50%)}
  .slide.hasph .em{display:block;font-size:clamp(44px,min(11vh,5vw),150px);margin-bottom:2.5vh}
  .slide.hasph .ttl{font-size:clamp(28px,min(7vh,3.4vw),120px);max-width:none}
  .slide.hasph .note{-webkit-line-clamp:6}
  .slide .when{font-size:clamp(15px,min(2.8vh,1.4vw),40px)}
  .slide.noph .txt{left:9vw;right:9vw}
  .slide.noph .em{font-size:clamp(64px,min(20vh,11vw),260px)}
  .slide.noph .ttl{font-size:clamp(40px,min(11vh,6vw),180px);max-width:26ch}
  .slide.noph .note{font-size:clamp(16px,min(3.4vh,1.8vw),48px);max-width:64ch}
  .slide.year .yy{font-size:clamp(120px,min(44vh,26vw),600px)}
  .slide.year .yl{font-size:clamp(22px,min(5.5vh,3vw),80px)}
  .slide.year .seas{max-width:none;gap:.5vw}
  .slide.year .seas i{height:1.6vh}
  .slide.title .ttl{font-size:clamp(48px,min(14vh,8vw),220px);max-width:none}
}
@media (min-aspect-ratio:21/9){
  .slide.hasph .photo{width:66vw}
  .slide.hasph .txt{width:26vw;left:4vw}
  .slide.noph .txt{left:12vw;right:12vw}
}

/* ---------- month in one row (accordion) ---------- */
.mrow .viewseg{margin:0 0 12px}
.acc{display:flex;gap:3px;height:clamp(230px,36vh,460px);margin:0 0 10px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:var(--line) transparent;padding-bottom:2px}
.aday{--s:var(--winter);flex:1 1 0;min-width:30px;position:relative;display:flex;flex-direction:column;align-items:stretch;gap:6px;text-align:left;
  padding:8px 0 0;border:1px solid var(--line);border-radius:9px;background:var(--surface);overflow:hidden;
  transition:flex-grow .35s cubic-bezier(.2,.7,.2,1),min-width .35s cubic-bezier(.2,.7,.2,1),background .2s}
.aday.we{background:var(--weekend)}
.aday.mon{margin-left:5px}
.aday.today{outline:2px solid var(--accent);outline-offset:-2px}
.aday.has{border-color:var(--s)}
.aday .ah{display:flex;flex-direction:column;align-items:center;line-height:1;gap:3px;padding:0 2px}
.aday .ah .wd{font-size:11px;color:var(--muted)}
.aday .ah .n{font-size:17px;font-weight:800}
.aday .aes{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:15px;line-height:1.15}
.aday .det{position:absolute;left:0;top:52px;width:240px;padding:0 12px;opacity:0;transition:opacity .15s;pointer-events:none;display:flex;flex-direction:column;gap:6px}
.aday .det .dt{font-size:13px;font-weight:700;color:var(--ink)}
.aday .det .dt::first-letter{text-transform:uppercase}
.aday .det .ageline{font-size:12px}
.aday .det .dph{width:100%;height:clamp(60px,11vh,150px);object-fit:cover;border-radius:6px;background:var(--faint)}
.aday .det .dm{display:flex;gap:6px;font-size:14px;font-weight:600;line-height:1.25}
.aday .det .dm .e{flex:0 0 auto}
.aday .det .more{font-size:12px;color:var(--muted)}
.aday .bars{margin-top:auto;display:flex;flex-direction:column;gap:2px;margin-left:-1px;margin-right:-1px}
.aday .sbar{margin-top:auto;height:5px;background:var(--s);opacity:.35}
.aday.has .sbar{opacity:1}
.aday .pb.s{margin-left:6px}.aday .pb.e{margin-right:6px}
.aday:hover,.aday:focus-visible,.aday.open{flex-grow:9;min-width:min(240px,70vw)}
.aday:hover .det,.aday:focus-visible .det,.aday.open .det{opacity:1;transition:opacity .25s .15s}
.aday:hover .aes,.aday:focus-visible .aes,.aday.open .aes{visibility:hidden}
.aday:hover .ah,.aday:focus-visible .ah,.aday.open .ah{align-items:flex-start;padding-left:12px}
@media (min-width:1200px){ .mrow{display:block} .mrow .pr{max-width:1100px} .acc{height:clamp(260px,40vh,560px)} .aday .ah .n{font-size:19px} }
@media (prefers-reduced-motion:reduce){ .aday{transition:none} }

/* ---------- year slide ---------- */
.slide.yslide{display:flex;flex-direction:column;gap:3vh;padding:7vh 6vw 14vh}
.yhead{display:flex;align-items:flex-end;gap:2vh 4vw;flex-wrap:wrap}
.yhead .yy{font-size:clamp(90px,min(26vh,17vw),420px);font-weight:800;letter-spacing:-.06em;line-height:.78}
.yside{display:flex;flex-direction:column;gap:1.2vh;padding-bottom:.6vh}
.yside .ya{font-size:clamp(26px,min(7vh,4vw),96px);font-weight:800;letter-spacing:-.02em;line-height:1;color:#9BBBF2}
.yal{font-size:clamp(12px,1.9vh,24px);text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.55);font-weight:600}
.yside .yc{font-size:clamp(15px,2.6vh,34px);color:rgba(255,255,255,.82);display:flex;flex-wrap:wrap;align-items:center;gap:.4em 1em}
.ycat{display:inline-flex;align-items:center;gap:.4em;font-size:.8em;color:rgba(255,255,255,.7)}
.ycat::before{content:"";width:.6em;height:.6em;border-radius:50%;background:var(--c)}
.ystat{display:flex;flex-wrap:wrap;gap:.8vh .8vw;font-size:clamp(13px,2.1vh,26px)}
.ywhole{display:flex;flex-wrap:wrap;align-items:center;gap:1vh 1vw}
.ychip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:.35em .9em;font-size:clamp(14px,2.3vh,30px)}
.ystrip{position:relative;flex:1;min-height:24vh;--axis:11vh;--lh:8.6vh}
.yaxis{position:absolute;left:0;right:0;bottom:var(--axis);height:1vh;min-height:5px;display:flex;gap:.35vw}
.yaxis i{flex:1;border-radius:1vh;background:var(--s)}
.ylabels{position:absolute;left:0;right:0;bottom:calc(var(--axis) - 3.6vh);display:flex}
.ylabels i{font-style:normal}
.ylabels span{flex:1;text-align:center;font-size:clamp(11px,1.8vh,22px);color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.06em}
.ytoday{position:absolute;left:var(--x);top:0;bottom:calc(var(--axis) - 1vh);border-left:2px dashed rgba(155,187,242,.7)}
.ytoday span{position:absolute;top:0;left:.5vw;font-size:clamp(11px,1.7vh,20px);color:#9BBBF2;font-weight:700;white-space:nowrap}
.ybar{position:absolute;bottom:calc(var(--axis) - 7.2vh - var(--i) * 3.2vh);height:2.7vh;min-height:16px;line-height:2.7vh;border-radius:1.4vh;
  background:var(--c);color:#fff;font-size:clamp(10px,1.6vh,20px);font-weight:600;padding:0 .7vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ymk{position:absolute;left:var(--x);bottom:calc(var(--axis) + 2.6vh + var(--lane) * var(--lh));transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:.3vh;max-width:12.5vw;text-align:center}
.ymk::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:calc(2.6vh + var(--lane) * var(--lh));background:rgba(255,255,255,.22)}
.ymk .e{font-size:clamp(20px,3.9vh,54px);line-height:1}
.ymk .t{font-size:clamp(11px,1.9vh,24px);line-height:1.15;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:12.5vw}
.ymk .dd{display:block;font-size:clamp(10px,1.5vh,18px);font-weight:400;color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slide.in .ymk,.slide.in .ybar{animation:pop .6s both}
.slide.in .ymk:nth-of-type(2n){animation-delay:.08s}.slide.in .ymk:nth-of-type(3n){animation-delay:.16s}
@keyframes pop{from{opacity:0;transform:translate(-50%,1.5vh)}to{opacity:1;transform:translate(-50%,0)}}
.slide.in .ybar{animation-name:fadein}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (max-aspect-ratio:1/1){
  .slide.yslide{padding:8vh 6vw 16vh}
  .ystrip{--lh:6.5vh}
  .ymk .t,.ymk .dd,.ylabels i{display:none}
  .ybar{font-size:0;padding:0}
}
@media (prefers-reduced-motion:reduce){.slide.in .ymk,.slide.in .ybar{animation:none}}

#themeBtn .i-sun{display:none}
#themeBtn.dark .i-sun{display:block}
#themeBtn.dark .i-moon{display:none}
body,.bar,.page,section.box,.item,.cell,.aday,dialog.card,dialog#menu,.iconbtn,.fchip{transition:background-color .25s,border-color .25s,color .25s}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <button class="iconbtn" id="backBtn" hidden aria-label="Terug naar het jaar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      <span class="lbl"></span>
    </button>
    <button class="tl-btn" id="tlBtn" aria-haspopup="dialog" aria-label="Kies een tijdlijn">
      <span class="tl-em" id="tlEm"></span>
      <span class="tl-txt"><b id="tlName"></b><small id="tlSub"></small></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <button class="iconbtn" id="themeBtn" aria-label="Donker thema">
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span class="lbl">Donker</span>
    </button>
    <button class="iconbtn" id="fsBtn" hidden aria-label="Volledig scherm">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <span class="lbl">Volledig scherm</span>
    </button>
    <button class="iconbtn" id="playBtn" aria-haspopup="dialog" aria-label="Presenteren">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
      <span class="lbl">Presenteren</span>
    </button>
    <button class="iconbtn" id="menuBtn" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <span class="lbl">Menu</span>
    </button>
  </div>
  <div class="filters" id="filters" role="group" aria-label="Filter op categorie"></div>
  <div class="minimap" id="minimap"></div>
  <div class="minimap-labels"><span id="mmFrom"></span><span id="mmTo"></span></div>
</header>

<main class="pager" id="pager" aria-label="Tijdlijn, swipe om te bladeren"></main>
<button class="nav prev" id="prevBtn" aria-label="Vorige"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="nav next" id="nextBtn" aria-label="Volgende"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
<button class="fab" id="fab">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  Toevoegen
</button>

<!-- Menu -->
<dialog id="menu" aria-labelledby="menuTitle">
  <div class="menu-in">
    <div class="menu-head"><h2 id="menuTitle">Menu</h2><button class="iconbtn" id="menuClose">Klaar</button></div>
    <section class="box" aria-labelledby="h-scope">
      <div class="sh"><h3 id="h-scope"><span>1</span>Periode</h3><div class="hint" id="spanInfo"></div></div>
      <div class="scope">
        <label class="field">Van<input id="from" type="number" inputmode="numeric" min="1000" max="3000"></label>
        <label class="field">Tot en met<input id="to" type="number" inputmode="numeric" min="1000" max="3000"></label>
        <button class="btn" id="apply">Toon periode</button>
        <div class="chips" id="presets"></div>
      </div>
    </section>
    <section class="box" aria-labelledby="h-years">
      <div class="sh"><h3 id="h-years"><span>2</span>Jaar</h3></div>
      <div class="strip" id="years" aria-label="Jaren"></div>
    </section>
    <section class="box" aria-labelledby="h-months">
      <div class="sh"><h3 id="h-months"><span>3</span>Maand</h3>
        <div class="legend">
          <span><b style="background:var(--winter)"></b>Winter</span><span><b style="background:var(--lente)"></b>Lente</span>
          <span><b style="background:var(--zomer)"></b>Zomer</span><span><b style="background:var(--herfst)"></b>Herfst</span>
        </div>
      </div>
      <div class="strip" id="months" aria-label="Maanden"></div>
    </section>
    <section class="box" aria-labelledby="h-days">
      <div class="sh"><h3 id="h-days"><span>4</span>Dag</h3><div class="hint" id="daysMonth"></div></div>
      <div class="strip" id="days" aria-label="Dagen"></div>
    </section>
    <section class="box" aria-labelledby="h-add">
      <div class="sh"><h3 id="h-add"><span>5</span>Momenten</h3></div>
      <div id="adds"></div>
    </section>
    <section class="box" aria-labelledby="h-bk">
      <div class="sh"><h3 id="h-bk"><span>6</span>Back-up en print</h3></div>
      <div class="bk">
        <button class="btn ghost" id="bkDownload">Download back-up</button>
        <button class="btn ghost" id="bkRestore">Zet back-up terug</button>
        <button class="btn ghost" id="bkPrint">Download printversie</button>
        <input type="file" id="bkFile" accept=".json,application/json" hidden>
      </div>
      <p class="bk-note" id="bkNote"></p>
    </section>
  </div>
</dialog>

<!-- Editor -->

    <div class="lab">Categorie<div class="catpick" id="catpick" role="group" aria-label="Categorie"></div></div>
    <div class="lab">Wanneer
      <div class="seg" id="lvlSeg" role="group" aria-label="Soort">
        <button type="button" data-l="y">Jaar</button><button type="button" data-l="m">Maand</button><button type="button" data-l="d">Dag</button>

<div class="toast" id="toast" role="status" aria-live="polite" popover="manual"></div>
<script>
(function(){
const $=id=>document.getElementById(id);
const MONTHS=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const MON_SHORT=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const WD_SHORT=['zo','ma','di','wo','do','vr','za'];
const WD_LONG=['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const SEASON=m=>(m===11||m<=1)?'winter':(m<=4)?'lente':(m<=7)?'zomer':'herfst';
const SEASON_NAME={winter:'Winter',lente:'Lente',zomer:'Zomer',herfst:'Herfst'};
const EMOJIS=['⭐','🎯','❤️','🎉','🎂','👣','🦷','🎒','🎓','🏠','✈️','🌱','🏆','🎨','⚽','💍','🔨','💶','🕯️','📌'];
const PALETTE=['#C8507A','#7A5BC4','#1F8A8A','#D0663A','#2F6FD1','#3E8E4F','#B8860B','#8E3B46','#4A5FC1','#6B7785'];
const OTHER={id:'?',name:'Overig',c:'#6B7785'};
const cats=(...list)=>list.map(([id,name,c])=>({id,name,c}));
/* What a timeline can be about */
const TYPES={
  kind:{label:'Een kind',emoji:'🧒',hint:'Leeftijd bij elk moment, verjaardagen vanzelf',anchorLabel:'Geboortedatum',mode:'age',
    namePh:'Naam van het kind',anchorTitle:n=>n+' is geboren',anchorEmoji:'👶',annTitle:()=>'Verjaardag',annEmoji:'🎂',
    yearLine:(n,name)=>n===0?'Geboortejaar':name+' wordt '+n,before:'voor de geboorte',
    cats:cats(['mijlpaal','Mijlpalen','#C8507A'],['eerste','Eerste keer','#D0663A'],['school','School','#2F6FD1'],['hobby','Sport en hobby','#1F8A8A'],['familie','Familie en vrienden','#7A5BC4'],['reizen','Reizen','#3E8E4F'],['overig','Overig','#6B7785'])},
  mij:{label:'Mijn eigen leven',emoji:'🙂',hint:'Je leven in jaren, met je leeftijd erbij',anchorLabel:'Geboortedatum',mode:'age',
    namePh:'Bijv. Mijn leven',defName:'Mijn leven',anchorTitle:()=>'Geboren',anchorEmoji:'👶',annTitle:()=>'Verjaardag',annEmoji:'🎂',
    yearLine:n=>n===0?'Geboortejaar':'Je wordt '+n,before:null,
    cats:cats(['gezin','Gezin','#C8507A'],['vrienden','Vrienden','#7A5BC4'],['werk','Werk','#1F8A8A'],['huis','Huis','#D0663A'],['reizen','Reizen','#2F6FD1'],['overig','Overig','#6B7785'])},
  relatie:{label:'Een relatie',emoji:'💞',hint:'Hoe lang jullie samen zijn, jubilea vanzelf',anchorLabel:'Samen sinds',mode:'dur',
    namePh:'Bijv. Wij samen',defName:'Wij samen',anchorTitle:()=>'Samen',anchorEmoji:'💞',annTitle:()=>'Jubileum',annEmoji:'🥂',
    yearLine:n=>n===0?'Het begin':n+' jaar samen',dur:(Y,M)=>Y?Y+' jaar samen':(M?M+(M===1?' maand':' maanden')+' samen':'net samen'),
    cats:cats(['samen','Samen','#C8507A'],['reizen','Reizen','#2F6FD1'],['huis','Huis','#D0663A'],['familie','Familie','#7A5BC4'],['mijlpaal','Mijlpalen','#B8860B'],['overig','Overig','#6B7785'])},
  huisdier:{label:'Een huisdier',emoji:'🐾',hint:'Leeftijd en verjaardagen van je dier',anchorLabel:'Geboortedatum',mode:'age',
    namePh:'Naam van het dier',anchorTitle:n=>n+' is geboren',anchorEmoji:'🐾',annTitle:()=>'Verjaardag',annEmoji:'🎂',
    yearLine:(n,name)=>n===0?'Geboortejaar':name+' wordt '+n,before:null,
    cats:cats(['mijlpaal','Mijlpalen','#C8507A'],['uitje','Uitjes','#3E8E4F'],['dierenarts','Dierenarts','#2F6FD1'],['overig','Overig','#6B7785'])},
  huis:{label:'Een huis',emoji:'🏠',hint:'Verbouwing, onderhoud en alles wat er gebeurde',anchorLabel:'Sleuteloverdracht',mode:'dur',
    namePh:'Bijv. adres of naam van het huis',anchorTitle:()=>'Sleutel gekregen',anchorEmoji:'🔑',annTitle:()=>'Jaar in huis',annEmoji:'🏠',
    yearLine:n=>n===0?'Het eerste jaar':n+' jaar in huis',dur:(Y)=>'jaar '+(Y+1)+' in huis',
    cats:cats(['verbouwing','Verbouwing','#D0663A'],['onderhoud','Onderhoud','#1F8A8A'],['tuin','Tuin','#3E8E4F'],['aankoop','Aankopen','#B8860B'],['moment','Momenten','#C8507A'])},
  bedrijf:{label:'Een bedrijf of project',emoji:'💼',hint:'Mijlpalen, klanten en projecten door de jaren',anchorLabel:'Startdatum',mode:'dur',
    namePh:'Naam van het bedrijf of project',anchorTitle:()=>'Gestart',anchorEmoji:'🚀',annTitle:()=>'Jubileum',annEmoji:'🎉',
    yearLine:n=>n===0?'Startjaar':n+' jaar sinds de start',dur:(Y)=>'jaar '+(Y+1),
    cats:cats(['mijlpaal','Mijlpalen','#C8507A'],['klant','Klanten','#2F6FD1'],['project','Projecten','#D0663A'],['team','Team','#7A5BC4'],['overig','Overig','#6B7785'])},
  plan:{label:'Doelen en plannen',emoji:'🎯',hint:'Doelen en mijlpalen met status, om bij te sturen',anchorLabel:'Start van het plan (optioneel)',mode:'dur',status:true,noAnn:true,
    namePh:'Bijv. Plannen 2027',anchorTitle:()=>'Start van het plan',anchorEmoji:'🚩',annTitle:()=>'',annEmoji:'',
    nameLbl:'Welk doel of welke mijlpaal?',notePh:'Wat is ervoor nodig, of wat moet beter?',
    yearLine:n=>n===0?'Startjaar van het plan':'Jaar '+(n+1)+' van het plan',dur:(Y)=>'jaar '+(Y+1),
    cats:cats(['doel','Doelen','#2F6FD1'],['mijlpaal','Mijlpalen','#C8507A'],['actie','Acties','#D0663A'],['evaluatie','Evaluatie','#7A5BC4'],['risico','Risico\'s','#8E3B46'])},
  anders:{label:'Iets anders',emoji:'✨',hint:'Vrij in te richten',anchorLabel:'Startdatum (optioneel)',mode:'dur',
    namePh:'Naam van de tijdlijn',defName:'Mijn tijdlijn',anchorTitle:()=>'Start',anchorEmoji:'🚩',annTitle:()=>'Jubileum',annEmoji:'🎉',
    yearLine:n=>n===0?'Startjaar':n+' jaar sinds de start',dur:(Y)=>'jaar '+(Y+1),
    cats:cats(['gezin','Gezin','#C8507A'],['vrienden','Vrienden','#7A5BC4'],['werk','Werk','#1F8A8A'],['huis','Huis','#D0663A'],['reizen','Reizen','#2F6FD1'],['overig','Overig','#6B7785'])}
};
const TYPE_ORDER=['kind','mij','relatie','huisdier','huis','bedrijf','plan','anders'];
const STATUS=[{id:'gepland',name:'Gepland',c:'#6B7785'},{id:'bezig',name:'Bezig',c:'#2F6FD1'},{id:'behaald',name:'Behaald',c:'#3E8E4F'},
  {id:'bijstellen',name:'Bijstellen',c:'#D0663A'},{id:'vervallen',name:'Vervallen',c:'#8E3B46'}];
const STAT=Object.fromEntries(STATUS.map(x=>[x.id,x]));
const pad=n=>String(n).padStart(2,'0');
const now=new Date(), TY=now.getFullYear(), TM=now.getMonth(), TD=now.getDate();
const TODAY0=new Date(TY,TM,TD).getTime();
const reduce=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const num=(y,m,d)=>y*10000+(m+1)*100+d;
const SEG_OK=/^[A-Za-z0-9_\-.~:@+]{1,200}$/;
const DAY_RE=/^\d{4}-\d{2}-\d{2}$/;

function el(tag,cls,text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function fmtDate(y,m,d){ return m==null?String(y):d==null?y+'-'+pad(m+1):y+'-'+pad(m+1)+'-'+pad(d); }
function parseDate(s){ const p=String(s).split('-').map(Number); return {y:p[0],m:p.length>1?p[1]-1:null,d:p.length>2?p[2]:null}; }
function labelFull(y,m,d){ return d!=null?WD_LONG[new Date(y,m,d).getDay()]+' '+d+' '+MONTHS[m]+' '+y:m!=null?MONTHS[m]+' '+y:'het jaar '+y; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function localId(p){ return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ---------- state ---------- */
let timelines={}, items={}, curTl=null, db=null, assets=null, downloads=null;
let scope={from:TY-5,to:TY+5}, activeCat=null, viewMode='list', monthView='cal';
try{ if(localStorage.getItem('tijdlijn.monthview')==='row') monthView='row'; }catch(e){}
try{ curTl=localStorage.getItem('tijdlijn.current')||null; viewMode=localStorage.getItem('tijdlijn.view')==='photos'?'photos':'list'; }catch(e){}
const TL=()=>timelines[curTl]||Object.values(timelines)[0];
const T=()=>TYPES[TL().type];

function defaultScope(anchor){
  if(anchor){ const y=parseDate(anchor).y; return {from:Math.min(y,TY),to:Math.max(y,TY)+1}; }
  return {from:TY-5,to:TY+5};
}
function normTl(id,v){
  if(!v||typeof v!=='object') return null;
  const type=TYPES[v.type]?v.type:'anders';
  let cs=Array.isArray(v.cats)?v.cats.filter(c=>c&&typeof c.id==='string'&&c.id&&typeof c.name==='string')
    .map(c=>({id:c.id.slice(0,40),name:c.name.slice(0,30)||'Categorie',c:/^#[0-9a-fA-F]{6}$/.test(c.c)?c.c:'#6B7785'})):[];
  if(!cs.length) cs=TYPES[type].cats.map(c=>Object.assign({},c));
  const anchor=typeof v.anchor==='string'&&DAY_RE.test(v.anchor)?v.anchor:null;
  const sc=v.scope&&Number.isFinite(v.scope.from)&&Number.isFinite(v.scope.to)&&v.scope.from<=v.scope.to?{from:v.scope.from,to:v.scope.to}:defaultScope(anchor);
  return {id,name:String(v.name||TYPES[type].defName||TYPES[type].label).slice(0,40),type,anchor,cats:cs,scope:sc,demo:!!v.demo,created:v.created||''};
}
function tlDoc(t){ return {name:t.name,type:t.type,anchor:t.anchor||null,cats:t.cats,scope:t.scope,demo:!!t.demo,created:t.created||new Date().toISOString()}; }
function mainTl(sc){ return normTl('main',{name:'Mijn tijdlijn',type:'anders',scope:sc||{from:TY-5,to:TY+5}}); }

function legacyDate(id){ return /^[ymd]\d{4}/.test(id)?id.slice(1):null; }
function normalize(id,v){
  if(!v||typeof v!=='object') return null;
  const date=typeof v.date==='string'?v.date:legacyDate(id);
  if(!date||!/^\d{4}(-\d{2}(-\d{2})?)?$/.test(date)) return null;
  const s=parseDate(date);
  const end=(typeof v.end==='string'&&s.d!=null&&DAY_RE.test(v.end))?v.end:null;
  return {id,tl:typeof v.tl==='string'&&v.tl?v.tl:'main',title:String(v.title||'').slice(0,80)||'Zonder naam',note:String(v.note||'').slice(0,1000),
    emoji:typeof v.emoji==='string'&&v.emoji?v.emoji:'⭐',cat:typeof v.cat==='string'?v.cat:'overig',date,end,repeat:!!v.repeat&&s.m!=null&&!end,

/* ---------- storage ---------- */
const LS3='tijdlijn.v3', LS2='tijdlijn.v2', LS1='tijdlijn.v1';
function loadLocal(){
  try{
    const o=JSON.parse(localStorage.getItem(LS3)||'null');
    if(o){ for(const [id,v] of Object.entries(o.timelines||{})){ const n=normTl(id,v); if(n) timelines[id]=n; }
      for(const [id,v] of Object.entries(o.items||{})){ const n=normalize(id,v); if(n) items[id]=n; } }
    [LS2,LS1].forEach(k=>{ const old=JSON.parse(localStorage.getItem(k)||'null'); if(!old) return;
      const src=old.items||old.moments||{}; for(const [id,v] of Object.entries(src)){ const n=normalize(id,v); if(n&&!items[id]) items[id]=n; }
      if(old.scope&&!timelines.main&&Object.keys(src).length) timelines.main=mainTl(old.scope); });
  }catch(e){}
}
function saveLocal(){
  try{ const t={},i={}; for(const id in timelines) if(!timelines[id]._temp) t[id]=tlDoc(timelines[id]); for(const id in items) i[id]=toDoc(items[id]);
    localStorage.setItem(LS3,JSON.stringify({timelines:t,items:i})); localStorage.removeItem(LS2); localStorage.removeItem(LS1); }catch(e){}
}
function failMsg(e){ return e&&e.code==='quota_exceeded'?'De opslag is vol. Verwijder eerst een paar momenten.':'Opslaan lukte niet. Probeer het opnieuw.'; }
async function putItem(it){

}
async function dropItem(id){

}

}
async function writeScope(){ const t=TL(); t.scope={from:scope.from,to:scope.to}; if(!t._temp) await putTl(t); }

let gotTl=false, gotMo=false, legacyScope=null, ready=false;
function connect(){
  const c=window.claude;
  if(!(c&&typeof c.use==='function')){ onReady(); return; }
  c.use('db').then(d=>{
    if(!d){ onReady(); return; }
    db=d;
    const pendingItems=Object.assign({},items), pendingTls={}; for(const id in timelines) if(!timelines[id]._temp) pendingTls[id]=timelines[id];
    let firstTl=true, firstMo=true;
    const subscribe=()=>{
    db.collection('timelines').onSnapshot(snap=>{
      const next={}; snap.docs.forEach(doc=>{ const n=normTl(doc.id,doc.data()); if(n) next[doc.id]=n; });
      if(firstTl){ firstTl=false; for(const id in pendingTls) if(!next[id]&&SEG_OK.test(id)){ next[id]=pendingTls[id]; db.collection('timelines').doc(id).set(tlDoc(pendingTls[id])).catch(()=>{}); } }
      const temp=Object.values(timelines).find(t=>t._temp);
      timelines=next; if(!Object.keys(timelines).length&&temp) timelines[temp.id]=temp;
      gotTl=true; onTimelinesChanged(); onReady();
    },()=>{ db=null; });
    db.collection('moments').onSnapshot(snap=>{
      const next={}; snap.docs.forEach(doc=>{ const n=normalize(doc.id,doc.data()); if(n) next[doc.id]=n; });
      if(firstMo){ firstMo=false;
        for(const id in pendingItems) if(!next[id]&&SEG_OK.test(id)){ next[id]=pendingItems[id]; db.collection('moments').doc(id).set(toDoc(pendingItems[id])).catch(()=>{}); }
        try{ [LS1,LS2,LS3].forEach(k=>localStorage.removeItem(k)); }catch(e){}
      }
      items=next; gotMo=true; refreshAll(); onReady();
    },()=>{ db=null; });
    };
    db.doc('config/scope').get().then(s=>{ const v=s.exists&&s.data(); if(v&&Number.isFinite(v.from)&&Number.isFinite(v.to)) legacyScope={from:v.from,to:v.to}; }).catch(()=>{}).finally(subscribe);
  }).catch(()=>onReady());
  c.use('assets').then(a=>{ assets=a||null; }).catch(()=>{});
  c.use('downloads').then(d=>{ downloads=d||null; updateBackupUI(); }).catch(()=>{});
}
function onReady(){
  if(ready) return;
  if(db&&!(gotTl&&gotMo)) return;
  ready=true;
  const real=Object.values(timelines).filter(t=>!t._temp);
  const hasMain=Object.values(items).some(it=>it.tl==='main');
  if(hasMain&&!timelines.main||hasMain&&timelines.main&&timelines.main._temp){
    const m=mainTl(legacyScope||(timelines.main&&timelines.main.scope)); putTl(m); timelines.main=m; onTimelinesChanged();
  }else if(!real.length){ openTlCreate(true); }
}
function onTimelinesChanged(){
  if(!Object.keys(timelines).length){ const t=mainTl(); t._temp=true; timelines.main=t; }
  if(!timelines[curTl]){ curTl=Object.keys(timelines)[0]; }
  const t=TL();
  if(t.scope.from!==scope.from||t.scope.to!==scope.to){ scope={from:t.scope.from,to:t.scope.to}; afterScopeChange(true); }
  if(activeCat&&!t.cats.some(c=>c.id===activeCat)) activeCat=null;
  renderFilters(); refreshAll();
  if($('tlSheet').open) renderTlSheet();
}

/* ---------- ages ---------- */
function anchorP(){ const t=TL(); return t.anchor?parseDate(t.anchor):null; }
function monthsBetween(a,y,m,d){ let n=(y-a.y)*12+(m-a.m); if(d!=null&&d<a.d) n--; return n; }
function ageLabel(y,m,d){
  const a=anchorP(); if(!a||m==null) return null;
  const type=T();
  const dd=d!=null?d:a.d;
  const n=monthsBetween(a,y,m,dd);
  const days=Math.round((new Date(y,m,dd).getTime()-new Date(a.y,a.m,a.d).getTime())/864e5);
  if(days<0) return type.mode==='age'?type.before:null;
  if(type.mode==='dur') return type.dur(Math.floor(n/12),n%12);
  if(n<1) return d==null?'eerste maand':days===0?null:days+(days===1?' dag':' dagen')+' oud';
  if(n<12) return n+(n===1?' maand':' maanden');
  const Y=Math.floor(n/12), M=n%12;
  return Y<18&&M?Y+' jaar en '+M+' mnd':Y+' jaar';
}
function yearLine(y){
  const a=anchorP(); if(!a||y<a.y) return null;
  return T().yearLine(y-a.y,TL().name);
}

/* ---------- occurrences ---------- */
const tlItems=()=>Object.values(items).filter(it=>it.tl===curTl);
function virtualItems(){
  const t=TL(), ty=TYPES[t.type]; if(!t.anchor) return [];
  const first={id:'__anchor',virtual:true,tl:t.id,title:ty.anchorTitle(t.name),emoji:ty.anchorEmoji,cat:null,date:t.anchor,end:null,repeat:false,photos:[],note:''};
  if(ty.noAnn) return [first];
  return [first,
          {id:'__ann',virtual:true,ann:true,tl:t.id,title:ty.annTitle(t.name),emoji:ty.annEmoji,cat:null,date:t.anchor,end:null,repeat:true,photos:[],note:''}];
}
let activeStatus=null;
const passes=it=>(!activeCat||it.cat===activeCat)&&(!activeStatus||it.status===activeStatus);
const visibleItems=()=>{ const own=tlItems().filter(passes); return activeCat||activeStatus?own:own.concat(virtualItems()); };
function occInYear(it,Y){
  const s=parseDate(it.date);
  if(it.repeat){ if(Y<s.y||(it.ann&&Y===s.y)) return null; return {it,y:Y,m:s.m,d:s.d==null?null:Math.min(s.d,dim(Y,s.m)),age:Y-s.y}; }
  if(it.end){ const e=parseDate(it.end); if(Y<s.y||Y>e.y) return null; return {it,y:s.y,m:s.m,d:s.d,e}; }

}
function keyIn(o,Y){ if(o.m==null) return -1; if(o.e&&o.y<Y) return 0; return (o.m+1)*100+(o.d||0); }
function yearOccs(Y,list){ return (list||visibleItems()).map(it=>occInYear(it,Y)).filter(Boolean).sort((a,b)=>keyIn(a,Y)-keyIn(b,Y)||(a.it.virtual?-1:0)-(b.it.virtual?-1:0)||a.it.title.localeCompare(b.it.title)); }
function inMonth(o,Y,M){ if(o.m==null) return false; if(o.e) return num(o.y,o.m,o.d||1)<=num(Y,M,dim(Y,M))&&num(o.e.y,o.e.m,o.e.d)>=num(Y,M,1); return o.m===M; }

function covers(o,Y,M,D){ if(o.d==null) return false; if(o.e){ const n=num(Y,M,D); return n>=num(o.y,o.m,o.d)&&n<=num(o.e.y,o.e.m,o.e.d); } return o.m===M&&o.d===D; }
function countInScope(){

    if(it.repeat) return s.y<=scope.to; const ey=it.end?parseDate(it.end).y:s.y; return s.y<=scope.to&&ey>=scope.from; }).length;
}
function whenLabel(o){

    return o.d+' '+MON_SHORT[o.m]+(same?'':' '+o.y)+' – '+o.e.d+' '+MON_SHORT[o.e.m]+(same?'':' '+o.e.y); }

function isOverdue(o){

/* ---------- pager ---------- */
let mode='year', curIdx=0; const filled=new Set();
const yearCount=()=>scope.to-scope.from+1;
const pageCount=()=>mode==='year'?yearCount():yearCount()*12;
const idxYear=i=>mode==='year'?scope.from+i:scope.from+Math.floor(i/12);
const idxMonth=i=>mode==='year'?TM:i%12;
function pickStartYear(){
  if(TY>=scope.from&&TY<=scope.to) return TY;
  const ys=tlItems().map(it=>parseDate(it.date).y).filter(y=>y>=scope.from&&y<=scope.to);
  return ys.length?Math.min(...ys):scope.from;
}
function buildPager(){
  const pg=$('pager'); pg.textContent=''; filled.clear();
  curIdx=Math.max(0,Math.min(pageCount()-1,curIdx));
  const frag=document.createDocumentFragment();
  for(let i=0;i<pageCount();i++){ const p=el('section','page'); p.dataset.i=i; frag.appendChild(p); }
  pg.appendChild(frag); goTo(curIdx,false);
}
function fillPage(i){
  const p=$('pager').children[i]; if(!p) return;
  p.textContent=''; const y=idxYear(i);
  p.appendChild(mode==='year'?yearPage(y):monthPage(y,idxMonth(i)));
  p.setAttribute('aria-label',mode==='year'?'Jaar '+y:MONTHS[idxMonth(i)]+' '+y);
  filled.add(i);
}
function fillAround(i){ for(let j=i-1;j<=i+1;j++) if(j>=0&&j<pageCount()&&!filled.has(j)) fillPage(j); }
function refreshPages(){ filled.forEach(i=>{ if(Math.abs(i-curIdx)>1){ const p=$('pager').children[i]; if(p) p.textContent=''; } }); filled.clear(); fillAround(curIdx); }
function goTo(i,smooth){
  i=Math.max(0,Math.min(pageCount()-1,i));
  const pg=$('pager'); pg.scrollTo({left:i*pg.clientWidth,behavior:smooth&&!reduce()?'smooth':'auto'});
  setCur(i);
}
function setCur(i){
  const yearChanged=idxYear(i)!==idxYear(curIdx);
  curIdx=i; fillAround(i); renderHeader();
  if(mode==='year'||yearChanged||!$('minimap').children.length) renderMinimap(); else markMinimap();
  $('prevBtn').disabled=i<=0; $('nextBtn').disabled=i>=pageCount()-1;
  $('prevBtn').setAttribute('aria-label',mode==='year'?'Vorig jaar':'Vorige maand');
  $('nextBtn').setAttribute('aria-label',mode==='year'?'Volgend jaar':'Volgende maand');
}
let raf=0;
$('pager').addEventListener('scroll',()=>{
  if(raf) return;
  raf=requestAnimationFrame(()=>{ raf=0; const pg=$('pager'); const i=Math.round(pg.scrollLeft/Math.max(1,pg.clientWidth)); if(i!==curIdx&&i>=0&&i<pageCount()) setCur(i); });
},{passive:true});
window.addEventListener('resize',()=>goTo(curIdx,false));
$('prevBtn').onclick=()=>goTo(curIdx-1,true);
$('nextBtn').onclick=()=>goTo(curIdx+1,true);
function enterMonth(y,m){ mode='month'; curIdx=(y-scope.from)*12+m; $('minimap').textContent=''; buildPager(); }
function exitMonth(){ const y=idxYear(curIdx); mode='year'; curIdx=y-scope.from; $('minimap').textContent=''; buildPager(); }
$('backBtn').onclick=exitMonth;
document.addEventListener('keydown',e=>{
  if(!$('show').hidden){ showKey(e); return; }
  if($('gallery').open){ if(e.key==='ArrowLeft') galStep(-1); if(e.key==='ArrowRight') galStep(1); return; }
  if(document.querySelector('dialog[open]')) return;
  if(e.target.closest&&e.target.closest('input,textarea,select')) return;
  if(e.key==='ArrowLeft'){ e.preventDefault(); goTo(curIdx-1,true); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); goTo(curIdx+1,true); }

function shrink(file){
  return new Promise(res=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)); const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.naturalWidth*k)); c.height=Math.max(1,Math.round(img.naturalHeight*k));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); c.toBlob(b=>res(b||file),'image/jpeg',.85); };
    img.onerror=()=>{ URL.revokeObjectURL(url); res(file); }; img.src=url;
  });
}

if(document.fullscreenEnabled){
  $('fsBtn').hidden=false;
  $('fsBtn').onclick=()=>{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>toast('Volledig scherm is hier niet beschikbaar')); };
  document.addEventListener('fullscreenchange',()=>{ $('fsBtn').querySelector('.lbl').textContent=document.fullscreenElement?'Sluiten':'Volledig scherm'; });
}

function refreshAll(){
  renderHeader(); renderMinimap(); refreshPages();
  if($('menu').open) renderMenu(false);
  if($('daySheet').open) renderDaySheet();
}

/* ---------- start ---------- */
loadLocal();
if(!Object.keys(timelines).length){ const t=mainTl(); t._temp=true; timelines.main=t; }
if(!timelines[curTl]) curTl=Object.keys(timelines)[0];
scope={from:TL().scope.from,to:TL().scope.to};
sel.y=pickStartYear(); curIdx=sel.y-scope.from;
fillScopeInputs(); renderFilters(); updateBackupUI(); buildPager();
window.addEventListener('load',()=>goTo(curIdx,false));
connect();
})();
