<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
	<title>Timelessline</title>
	<rect width="512" height="512" rx="112" fill="#1d2733"/>
	<!-- The year as one line in the colours of its seasons, and the line of today across it, as in the app. -->
	<clipPath id="line"><rect x="64" y="226" width="384" height="60" rx="30"/></clipPath>
	<g clip-path="url(#line)">
		<rect x="64" y="226" width="96" height="60" fill="#7faad0"/>
		<rect x="160" y="226" width="96" height="60" fill="#8cc468"/>
		<rect x="256" y="226" width="96" height="60" fill="#f0b942"/>
		<rect x="352" y="226" width="96" height="60" fill="#c27a45"/>
	</g>
	<rect x="372" y="186" width="18" height="140" rx="9" fill="#fff" stroke="#1d2733" stroke-width="10"/>
</svg>
